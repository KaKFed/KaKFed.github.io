<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Surreal Site</title>
  <style>
      body {
      margin: 0;
      width: 1348px;   /* ширина картинки */
      height: 1714px;  /* висота картинки */
      background: url("background.png") no-repeat top left;
      background-size: 1348px 1714px; /* щоб фон точно підходив */
      font-family: Arial, sans-serif;
      position: relative; /* для позиціонування силки */
    }
   a {
      color: blue;          /* синій текст */
      text-decoration: none; /* без підкреслення */
      font-size: 2rem;
      position: absolute;    /* дозволяє ставити де захочеш */
      top: 200px;            /* відступ зверху */
      left: 100px;           /* відступ зліва */
    }

    a:hover {
      text-decoration: underline; /* підкреслення при наведенні */
    }
  </style>
</head>
<body>
  <a href="song.html">SONG</a>
</body>
</html>
